name: jev-zombie-duel
description: jev picks the bot's control states each turn against one zombie in a walled arena.
template: ../templates/arenas/compact.yaml

world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false

players:
  - name: JevFighter
    pos: [0.5, -60, 0.5]
    # Operator so the client can freeze and step the server (JEV_FROZEN, see TIMING in src/regime.ts).
    op: true
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: cobblestone, count: 16 }

entities:
  - { type: zombie, pos: [10.5, -60, 0.5], nbt: "{PersistenceRequired:1b}" }

client:
  command: bun
  args: ["../src/fight.ts"]

goal:
  kind: all
  # Wall time. A frozen fight spends jev's latency per window on top of game time, so allow ten minutes.
  timeout: 600
  goals:
    - kind: entityCount
      entity: zombie
      max: 0
    - kind: completion
      who: JevFighter
