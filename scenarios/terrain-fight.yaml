name: jev-terrain-fight
description: jev against two zombies, a bow skeleton and a flanking creeper on broken ground, a step, a low wall and a hollow inside the compact arena.

world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    mobGriefing: false

# The compact arena's own geometry, since a fixture's geometry replaces the template's entirely.
geometry:
  - fill: { block: bedrock, from: [-6, -64, -8], to: [18, -64, 8] }
  - fill: { block: dirt, from: [-6, -63, -8], to: [18, -62, 8] }
  - fill: { block: sea_lantern, from: [-6, -61, -8], to: [18, -61, 8] }
  - fill: { block: bedrock, from: [-6, -63, -8], to: [-6, -58, 8] }
  - fill: { block: bedrock, from: [18, -63, -8], to: [18, -58, 8] }
  - fill: { block: bedrock, from: [-5, -63, -8], to: [17, -58, -8] }
  - fill: { block: bedrock, from: [-5, -63, 8], to: [17, -58, 8] }
  # A one-block step the bot can climb, between it and the zombies.
  - fill: { block: stone, from: [3, -60, 1], to: [6, -60, 4] }
  # A two-high wall segment on the archer's line: cover from one side, a corner to be pinned against from the other.
  - fill: { block: cobblestone, from: [9, -60, -1], to: [9, -59, 1] }
  # A one-deep hollow off to the right of the approach: a step down that anything can climb out of. A deeper pit
  # only ever produced stalemates, with the last mob or the bot stuck on its floor out of everyone's reach.
  - fill: { block: air, from: [11, -61, -3], to: [13, -61, -1] }

players:
  - name: JevFighter
    pos: [0.5, -60, 0.5]
    # Operator so the client can freeze and step the server (JEV_FROZEN, see TIMING in src/regime.ts).
    op: true
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

entities:
  - { type: zombie, pos: [9.5, -60, 3.5], nbt: "{PersistenceRequired:1b}" }
  - { type: zombie, pos: [12.5, -60, 5.5], nbt: "{PersistenceRequired:1b}" }
  - { type: skeleton, pos: [15.5, -60, 0.5], nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}' }
  - { type: creeper, pos: [6.5, -60, -6.5], nbt: "{PersistenceRequired:1b}" }

client:
  command: bun
  args: ["../src/fight.ts"]

goal:
  kind: all
  # Wall time. A frozen fight spends jev's latency per window on top of game time, so allow ten minutes.
  timeout: 600
  goals:
    - { kind: entityCount, entity: zombie, max: 0 }
    - { kind: entityCount, entity: skeleton, max: 0 }
    - { kind: entityCount, entity: creeper, max: 0 }
    - { kind: completion, who: JevFighter }
