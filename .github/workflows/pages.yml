# Publishes the fight site (site/ built into dist/) to GitHub Pages on every push to main.
# Pages must be set to "GitHub Actions" as the source under the repository's Settings > Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "package.json", "bun.lock", "tsconfig.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src/record/demo.test.ts src/sense/perception/bow-timing.test.ts
      - run: bun site/build.ts --release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
