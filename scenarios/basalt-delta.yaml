name: jev-basalt-delta
description: "Uneven basalt-delta ground: 72 basalt cells in clumps and three plateaus, two hollows, two magma patches, a lava pool at 13,-3; two zombies and a bow skeleton. The loop refuses any move into lava or off a drop."

world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    mobGriefing: false

